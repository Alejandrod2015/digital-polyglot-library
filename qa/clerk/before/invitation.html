<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Your invitation to Digital Polyglot</title>
        <style type="text/css">
            #outlook a {
                padding: 0
            }

            .ExternalClass {
                width: 100%
            }

            .ExternalClass,
            .ExternalClass p,
            .ExternalClass span,
            .ExternalClass font,
            .ExternalClass td,
            .ExternalClass div {
                line-height: 100%
            }

            body,
            table,
            td,
            a {
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%
            }

            table,
            td {
                mso-table-lspace: 0;
                mso-table-rspace: 0
            }

            img {
                -ms-interpolation-mode: bicubic
            }

            img {
                border: 0;
                outline: none;
                text-decoration: none
            }

            a img {
                border: none
            }

            td img {
                vertical-align: top
            }

            table,
            table td {
                border-collapse: collapse
            }

            body {
                margin: 0;
                padding: 0;
                width: 100% !important
            }

            .mobile-spacer {
                width: 0;
                display: none
            }

            @media all and (max-width:639px) {
                .container {
                    width: 100% !important;
                    max-width: 600px !important
                }

                .mobile {
                    width: auto !important;
                    max-width: 100% !important;
                    display: block !important
                }

                .mobile-center {
                    text-align: center !important
                }

                .mobile-right {
                    text-align: right !important
                }

                .mobile-left {
                    text-align: left !important;
                }

                .mobile-hidden {
                    max-height: 0;
                    display: none !important;
                    mso-hide: all;
                    overflow: hidden
                }

                .mobile-spacer {
                    width: auto !important;
                    display: table !important
                }

                .mobile-image,
                .mobile-image img {
                    height: auto !important;
                    max-width: 600px !important;
                    width: 100% !important
                }
            }

            .cl-card {
                border: 1px solid #EEEEF0;
                border-radius: 10px;
                border-collapse: separate !important;
                width: 100%
            }

            .cl-label {
                background-color: #FAFAFB;
                color: #9ca3af;
                font-size: 14px;
                font-weight: normal;
                white-space: nowrap;
                padding: 6px 16px 6px 20px;
                vertical-align: top;
                line-height: 20px
            }

            .cl-value {
                background-color: #FAFAFB;
                color: #111827;
                font-size: 14px;
                font-weight: 600;
                padding: 6px 20px 6px 0;
                vertical-align: top;
                line-height: 20px
            }

            .cl-list {
                width: 100%;
                border-collapse: collapse
            }

            .cl-list-item {
                padding: 10px 0;
                border-bottom: 1px dashed #B7B8C2;
                vertical-align: top
            }

            .cl-list-link {
                color: #111827;
                font-size: 14px;
                font-weight: 600;
                line-height: 20px;
                text-decoration: underline;
                font-family: Helvetica, Arial, sans-serif
            }

            .cl-list-meta {
                color: #9ca3af;
                font-size: 13px;
                font-weight: normal;
                line-height: 18px;
                font-family: Helvetica, Arial, sans-serif
            }
        </style>
        <!--[if mso]><style type="text/css">body, table, td, a { font-family: Arial, Helvetica, sans-serif !important; }</style><![endif]-->
    </head>

    <body style="font-family: Helvetica, Arial, sans-serif; margin: 0px; padding: 0px; background-color: #ffffff;">
        <span style="color: transparent; display: none; height: 0px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; visibility: hidden; width: 0px;">Your invitation to Digital Polyglot</span>
        <table cellpadding="0" cellspacing="0" border="0" width="100%" class="body" style="width: 100%;">
            <tbody>
                <tr>
                    <td align="center" valign="top" style="vertical-align: top; line-height: 1; padding: 48px 32px;">
                        <table cellpadding="0" cellspacing="0" border="0" width="600" class="header container" style="width: 600px;">
                            <tbody>
                                <tr>
                                    <td align="left" valign="top" style="vertical-align: top; line-height: 1; padding: 16px 32px 8px 32px;">
                                        <p style="padding: 0px; margin: 0px; font-family: Helvetica, Arial, sans-serif; color: #111827; font-size: 18px; line-height: 26px; font-weight: 700;">
                                            <b>Digital Polyglot</b>
                                        </p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <table cellpadding="0" cellspacing="0" border="0" width="600" class="main container" style="width: 600px; border-collapse: separate;">
                            <tbody>
                                <tr>
                                    <td align="left" valign="top" bgcolor="#fff" style="vertical-align: top; line-height: 1; background-color: #ffffff; border-radius: 0px;">
                                        <table cellpadding="0" cellspacing="0" border="0" width="100%" class="block" style="width: 100%; border-collapse: separate;">
                                            <tbody>
                                                <tr>
                                                    <td align="left" valign="top" bgcolor="#ffffff" style="vertical-align: top; line-height: 1; padding: 32px 32px 48px; background-color: #ffffff; border-radius: 0px;">
                                                        <h1 class="h1" align="left" style="padding: 0px; margin: 0px; font-style: normal; font-family: Helvetica, Arial, sans-serif; font-size: 24px; line-height: 32px; color: #111827; font-weight: 700;"> Your invitation </h1>
                                                        <p align="left" style="padding: 0px; margin: 16px 0px 0px; font-family: Helvetica, Arial, sans-serif; color: #000000; font-size: 14px; line-height: 21px;">
                                                            You are invited to join Digital Polyglot.
                                                        </p>
                                                        <p align="left" style="padding: 0px; margin: 16px 0px 0px; font-family: Helvetica, Arial, sans-serif; color: #000000; font-size: 14px; line-height: 21px;">
                                                            This invitation will expire in {{invitation.expires_in_days}} days.
                                                        </p>
                                                        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: separate; margin: 32px 0px 0px 0px;">
                                                            <tbody>
                                                                <tr>
                                                                    <td align="center" valign="middle" bgcolor="#131316" style="border-radius: 6px; padding: 0;">
                                                                        <a class="cl-branded-button" target="_blank" href="https://digitalpolyglot.com/sign-up#sample" style="display: inline-block; cursor: pointer; text-decoration: none; font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; color: #ffffff; border-radius: 6px; height: 30px; line-height: 30px; padding: 0 10px; white-space: nowrap; background: linear-gradient(180deg, rgba(255,255,255,0.10) 45%, rgba(255,255,255,0.00) 55%), #131316; box-shadow: 0 2px 3px 0 rgba(0,0,0,0.20), 0 0 0 0.5px #131316, inset 0 1px 0 0 rgba(255,255,255,0.15);">Accept invitation</a>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                        <p style="padding: 0px; margin: 16px 0px 0px; font-family: Helvetica, Arial, sans-serif; color: #000000; font-size: 14px; line-height: 21px;"> If you're having trouble with the above button, <a href="https://digitalpolyglot.com/sign-up#sample" style="text-decoration: underline; font-size: 14px; color: #131316; font-family: Helvetica, Arial, sans-serif; font-weight: normal; line-height: 1.5;" class="cl-branded-link" target="_blank">click here</a>. </p>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        {{> footer}}
                    </td>
                </tr>
            </tbody>
        </table>
    </body>

</html>
