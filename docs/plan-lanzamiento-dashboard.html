        { t: 'Al tener fecha', kind: 'checks', items: [

    },
    {
      id: 'testers', n: '4', title: 'Testers', status: 'sin',
      lead: 'Al lanzar, cada tester recibe un correo de agradecimiento con un solo botón: quedarse 6 meses más con premium completo. Quien no haga nada pasa a basic el día del lanzamiento y puede volver a postularse en /beta. No se promete renovación.',
      sections: [
        { t: 'Maqueta y base de partida', kind: 'cards', cards: [
          ['Maqueta', 'Beta Seat Renewal', '<a href="https://claude.ai/artifact/KuKNTzYjN95977JeLrkLfq">artifact</a> · copia en docs/beta-seat-renewal-mockup.html'],
          ['Testers activos', '104', '101 recibieron el boletín de septiembre, 3 de baja'],
          ['Nunca entraron', '40%', 'de 56 invitados, igual en iOS y Android'],
          ['Feedback real', '6 personas', 'Vincent, Colombe, Steffen, Ty, Christoph, Gary; todo por correo'] ] },
        { t: 'Antes del correo', kind: 'checks', items: [
          ['test-1', '<b>Caducidad del premium beta.</b> Hoy grantBetaPlan escribe plan = premium sin fecha y solo lo quita revokeBetaPlan a mano. "Keep my seat" tiene que escribir lanzamiento + 6 meses; el resto cae a basic el día del lanzamiento.'],
          ['test-2', '<b>Cuentas antiguas.</b> Las creadas antes del 07-09 tienen gracia hasta el 31-03-2027; si aceptan, manda la mayor de las dos fechas.'],
          ['test-3', '<b>Correo real:</b> builder 13 en src/lib/emails/beta.ts, kit DPE, en "we", beta una sola vez y en segundo plano.'],
          ['test-4', '<b>Pantalla "Your seat" en la app</b> con deep link, o página web con token si la app no llega a la versión de lanzamiento.'],
          ['test-5', '<b>Envío</b> con el verbo del usuario y prueba de veracidad en web, iOS y Android.'] ] },
        { t: 'Después: grupo insider', kind: 'text', html: '<p>15-20 personas con premium a cambio de feedback, por correo. Se forma hacia marzo de 2027, cuando acabe la gracia; no antes. El mecanismo ya existe (<code>BillingEntitlement</code> con fuente <code>comp</code>, ruta <code>/api/studio/insiders</code>).</p>' },
      ]
    },
    {
      id: 'comunicacion', n: '5', title: 'Comunicación', status: 'sin',
      lead: 'Tres públicos y ninguna pieza de lanzamiento escrita todavía. Todo correo que anuncie algo pasa por dos candados: el verbo del usuario y la prueba de que lo anunciado se ve en web, iOS y Android con la versión de la tienda.',
      sections: [
        { t: 'Por público', kind: 'table', head: ['Público', 'Canal', 'Hoy', 'Pieza de lanzamiento'], rows: [
          ['Testers (104)', 'Correo Resend, builders de emails/beta.ts', 'Boletín de septiembre enviado el 21-09 a 101', 'Correo "Keep my seat"'],
          ['Tienda de libros', 'Correo del freebie y del pedido', 'CTA a la app en los dos correos; la pantalla tras reclamar el freebie sigue sin CTA', 'Correo de lanzamiento a la lista; arreglar la pantalla'],
          ['Tráfico nuevo', 'Meta: leads a /beta (10 €/día, US/UK/CA/AU) y audiolibros', 'Ambas vivas', 'Campaña con objetivo instalación/compra y CTA a la tienda; la de /beta se pausa o se reconvierte'],
          ['Instagram', 'Comentarios en 20 cuentas de profes de español', 'Estrategia definida, sin ritmo', 'Anuncio del lanzamiento en el perfil'],
          ['Push', 'sendCampaign a todos o por tipo', 'No segmenta por idioma', 'Un push único el día del lanzamiento, o ninguno'] ] },
        { t: 'Piezas por hacer', kind: 'checks', items: [
          ['com-1', '<b>Correo a testers</b> (chat ejecutor).'],
          ['com-2', '<b>Correo a la lista de la tienda.</b>'],
          ['com-3', '<b>Campaña de Meta de lanzamiento</b> (CTA "Listen now", casilla de IA marcada).'],
          ['com-4', '<b>CTA en la pantalla tras reclamar el freebie.</b>'],
          ['com-5', '<b>Ficha de las tiendas:</b> capturas y texto finales (las 5 de iPhone 6.5" ya subidas el 15-07).'] ] },
        { t: 'Reglas de todas las piezas', kind: 'text', html: '<p>Hablan en "we". "Beta" aparece una vez y en segundo plano. Nada de copy antropomórfico. Capturas dentro de un marco de teléfono. Cada enlace probado. <code>/go/app</code> lleva a la tienda en móvil y al lector en escritorio, así que lo prometido tiene que verse en los tres sitios.</p>' },
      ]
    },
    {
      id: 'despliegue', n: '6', title: 'Despliegue y vigilancia', status: 'curso',
      lead: 'El lanzamiento es la etapa 1 del plan de despliegue (hasta ~300 DAU): deshacer rápido y no romper a quien paga. Medido el 06-09: 5 piezas hechas de 11.',
      sections: [
        { t: 'Piezas de la etapa 1', kind: 'table', head: ['Pieza', 'Estado', 'Qué es'], rows: [
          ['Sentry móvil', '<span class="tag ok">hecha</span>', 'proyecto digital-polyglot-mobile, sesión recibida desde build Release'],
          ['OTA con expo-updates', '<span class="tag ok">hecha</span>', 'canales preview y production, fingerprint'],
          ['Canales EAS', '<span class="tag ok">hecha</span>', 'perfil preview apunta a staging por env'],
          ['Gate de veracidad mira OTA', '<span class="tag ok">hecha</span>', 'pre-comms-claim-guard.sh'],
          ['Rama de build ignorada', '<span class="tag ok">hecha</span>', 'vercel-ignore-build.sh parametrizado'],
          ['CI en cada PR', '<span class="tag pend">pendiente</span>', 'typecheck, 12 lints y tests en GitHub Actions'],
          ['Crons sin salida en staging', '<span class="tag pend">pendiente</span>', 'sin Resend ni FCM fuera de producción'],
          ['Proyecto de staging en Vercel', '<span class="tag pend">manual</span>', 'rama de Neon sembrada y correos anonimizados'],
          ['Rollout escalonado en Play', '<span class="tag pend">manual</span>', '20% y luego 100% en 24 h; Phased Release en iOS'],
          ['Ensayo de restauración de Neon', '<span class="tag pend">manual</span>', 'confirmar ventana PITR y restaurar una vez'],
          ['Umbral de aborto escrito', '<span class="tag pend">manual</span>', '3 usuarios distintos con crash en la misma release en una hora detienen el rollout'] ] },
        { t: 'Cadencia tras el lanzamiento', kind: 'text', html: '<p>Tren semanal fijo; los hotfix van por su carril. Web: Instant Rollback como plan A, nunca un revert (gasta build). Móvil: <code>preview</code> 24 h en TestFlight interno y luego <code>production</code>. Base de datos: expand/contract, nunca borrar una columna en la release en que deja de usarse. Coste: Vercel Pro (~20 €/mes) más la rama de Neon.</p><p>El plan vive en <code>docs/plan-despliegue-por-etapas.md</code> y en <code>src/lib/releaseStage.ts</code>; <code>lint:release-readiness</code> lo mide en el pre-push y el digest de los lunes imprime lo pendiente.</p>' },
      ]
    },
  ];

  const D = [
    ['d1', 'Fecha de lanzamiento', 'Fija la ventana de la oferta €89, el fin del premium beta y la fecha de los correos. Va primero.'],
    ['d2', 'Versión: ¿340/28 tal cual o una build más con la pantalla "Your seat"?', 'Decide si el botón de testers vive en la app o en una página web con token. Antes de App Review.'],
    ['d3', 'Qué borradores entran', 'Cambia la ficha de la tienda y el correo de lanzamiento. Friends IT A1 está a 21 portadas.'],
    ['d4', 'Caducidad del premium beta', 'Fecha de fin en grantBetaPlan o revocación en lote el día del lanzamiento. Sin esto la oferta de 6 meses no acaba.'],
    ['d5', 'Los 4 live con personajes no nativos: corregir antes o después', 'Toca texto y, en 2 de ellos, audio.'],
    ['d6', 'Ventana de la oferta €89: 4 o 6 semanas', 'Fecha de fin en ASC, Play y el coupon de Stripe.'],
    ['d7', 'Campaña de Meta: pausar la de leads a /beta o reconvertirla', 'El formulario de beta deja de tener sentido el día del lanzamiento.'],
  ];

  // ---------- State ----------
  let state = { launchDate: '', checks: {}, decisions: {}, status: {} };
  let active = 'resumen';
  let db = null, docRef = null, writing = Promise.resolve();
  const LS = 'dpl-launch-plan';

  function lsLoad() { try { const s = localStorage.getItem(LS); if (s) state = Object.assign(state, JSON.parse(s)); } catch (e) {} }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

  function persist(patch) {
    Object.keys(patch).forEach(k => { state[k] = Object.assign({}, state[k] || {}, patch[k]); });
    if (typeof patch.launchDate === 'string') state.launchDate = patch.launchDate;
    lsSave();
    if (docRef) {
      writing = writing.then(() => docRef.set(clone(state))).catch(() => {});
    }
    renderAll();
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ---------- Helpers ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function statusOf(f) { return state.status[f.id] || f.status; }
  function allChecks() { const out = []; F.forEach(f => f.sections.forEach(s => (s.items || []).forEach(i => out.push(i[0])))); return out; }
  function checksOf(f) { const out = []; f.sections.forEach(s => (s.items || []).forEach(i => out.push(i[0]))); return out; }
  function doneCount(ids) { return ids.filter(id => state.checks[id]).length; }
  function decidedCount() { return D.filter(d => state.decisions[d[0]] && state.decisions[d[0]].done).length; }
  function daysTo(iso) {
    if (!iso) return null;
    const t = new Date(iso + 'T00:00:00'); const now = new Date(); now.setHours(0, 0, 0, 0);
    return Math.round((t - now) / 86400000);
  }
  function fmtDate(iso) {
    if (!iso) return 'sin fijar';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ---------- Render ----------
  function renderAll() { renderDate(); renderKpis(); renderNav(); renderPanel(); }

  function renderDate() {
    const inp = $('#launch'); if (inp.value !== (state.launchDate || '')) inp.value = state.launchDate || '';
    const d = daysTo(state.launchDate); const el = $('#days');
    if (d === null) { el.textContent = 'sin fijar'; el.className = 'days none'; }
    else { el.className = 'days'; el.textContent = d > 0 ? 'faltan ' + d + ' días' : d === 0 ? 'es hoy' : 'hace ' + (-d) + ' días'; }
  }

  function renderKpis() {
    const all = allChecks(); const dn = doneCount(all);
    const k = [
      ['Fecha', state.launchDate ? fmtDate(state.launchDate) : 'Sin fijar', state.launchDate ? 'decisión 1 tomada' : 'decisión 1, bloquea el resto', 'decisiones'],
      ['Tienda', 'iOS 340 · Android 28', 'TestFlight y alpha, ninguna pública', 'producto'],
      ['Catálogo', '27 live', '21 en borrador', 'catalogo'],
      ['Etapa 1', '5 / 11', 'piezas de despliegue hechas', 'despliegue'],
      ['Tareas', dn + ' / ' + all.length, 'casillas marcadas en todos los frentes', 'producto'],
      ['Decisiones', decidedCount() + ' / ' + D.length, 'tomadas', 'decisiones'],
    ];
    $('#kpis').innerHTML = k.map(x => '<button class="kpi" type="button" data-go="' + x[3] + '"><div class="l">' + x[0] + '</div><div class="v">' + esc(x[1]) + '</div><div class="s">' + esc(x[2]) + '</div></button>').join('');
  }

  function renderNav() {
    const items = [{ id: 'resumen', n: '0', title: 'Resumen' }].concat(F).concat([{ id: 'decisiones', n: '7', title: 'Decisiones', dec: true }]);
    $('#nav').innerHTML = items.map(it => {
      let dot = '';
      if (it.id === 'resumen') dot = '';
      else if (it.dec) dot = '<span class="st ' + (decidedCount() === D.length ? 'dot-listo' : 'dot-bloq') + '"></span>';
      else dot = '<span class="st dot-' + statusOf(it) + '"></span>';
      return '<button class="nb' + (active === it.id ? ' active' : '') + '" type="button" data-go="' + it.id + '"><span class="n">' + it.n + '</span><span class="t">' + esc(it.title) + '</span>' + dot + '</button>';
    }).join('');
  }

  function chev() { return '<span class="chev"><svg viewBox="0 0 10 10" fill="none"><path d="M3 1.5 6.5 5 3 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'; }

  function sectionHtml(s, idx) {
    const open = !s.closed && idx === 0 ? ' open' : '';
    let body = '';
    if (s.kind === 'table') {
      body = '<div class="tw"><table><thead><tr>' + s.head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
        s.rows.map(r => '<tr>' + r.map((c, i) => '<td>' + (i === 0 && (c === 'LIVE' || c === 'DRAFT') ? '<span class="tag ' + c.toLowerCase() + '">' + c + '</span>' : c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    } else if (s.kind === 'checks') {
      body = '<ul class="checks">' + s.items.map(it => '<li><label class="' + (state.checks[it[0]] ? 'done' : '') + '"><input type="checkbox" data-check="' + it[0] + '"' + (state.checks[it[0]] ? ' checked' : '') + '><span>' + it[1] + '</span></label></li>').join('') + '</ul>';
    } else if (s.kind === 'cards') {
      body = '<div class="cards">' + s.cards.map(c => '<div class="card"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div><div class="d">' + c[2] + '</div></div>').join('') + '</div>';
    } else { body = s.html; }
    let cnt = '';
    if (s.kind === 'checks') cnt = '<span class="cnt">' + doneCount(s.items.map(i => i[0])) + ' / ' + s.items.length + '</span>';
    if (s.kind === 'table') cnt = '<span class="cnt">' + s.rows.length + '</span>';
    return '<details' + open + '><summary>' + chev() + '<span>' + esc(s.t) + '</span>' + cnt + '</summary><div class="body">' + body + '</div></details>';
  }

  function renderPanel() {
    const p = $('#panel');
    if (active === 'resumen') {
      const rows = F.map(f => {
        const ids = checksOf(f); const st = statusOf(f);
        return '<tr><td><button class="btn" type="button" data-go="' + f.id + '">' + f.n + ' · ' + esc(f.title) + '</button></td><td><span class="status ' + st + '" style="cursor:default"><span class="dot"></span>' + ST[st] + '</span></td><td>' + doneCount(ids) + ' / ' + ids.length + '</td><td>' + esc(f.lead.split('. ')[0]) + '.</td></tr>';
      }).join('');
      const pend = D.filter(d => !(state.decisions[d[0]] && state.decisions[d[0]].done));
      p.innerHTML = '<div class="ph"><h2>Resumen</h2><p class="lead">' + (state.launchDate ? 'Lanzamiento el <b>' + fmtDate(state.launchDate) + '</b>.' : '<b>La fecha de lanzamiento no está fijada</b> y es la primera decisión: sin ella no se puede montar nada de lo que tiene ventana (oferta €89, fin del premium beta, correos).') + ' La base sobre la que se lanza es iOS 340 y Android 28, ya en las tiendas en beta.</p></div>' +
        '<details open><summary>' + chev() + '<span>Frentes</span><span class="cnt">' + F.length + '</span></summary><div class="body"><div class="tw"><table><thead><tr><th>Frente</th><th>Estado</th><th>Tareas</th><th>En una línea</th></tr></thead><tbody>' + rows + '</tbody></table></div></div></details>' +
        '<details open><summary>' + chev() + '<span>Decisiones pendientes</span><span class="cnt">' + pend.length + ' / ' + D.length + '</span></summary><div class="body">' + (pend.length ? '<div class="tw"><table><thead><tr><th>#</th><th>Decisión</th><th>Por qué bloquea</th></tr></thead><tbody>' + pend.map((d, i) => '<tr><td>' + d[0].slice(1) + '</td><td>' + esc(d[1]) + '</td><td>' + esc(d[2]) + '</td></tr>').join('') + '</tbody></table></div><p style="margin-top:10px"><button class="btn" type="button" data-go="decisiones">Tomar decisiones</button></p>' : '<p>Todas tomadas.</p>') + '</div></details>';
      return;
    }
    if (active === 'decisiones') {
      p.innerHTML = '<div class="ph"><h2>Decisiones abiertas</h2><p class="lead">Las filas van en el orden en que bloquean. Escribe lo decidido y márcala; la nota se guarda al salir del campo.</p></div><div class="dec" style="margin-top:16px">' +
        D.map(d => { const s = state.decisions[d[0]] || {}; return '<div class="dc' + (s.done ? ' done' : '') + '"><div class="num">' + d[0].slice(1) + '</div><div><h4>' + esc(d[1]) + '</h4><div class="why">' + esc(d[2]) + '</div><div class="row"><textarea data-note="' + d[0] + '" placeholder="Qué se decidió">' + esc(s.note || '') + '</textarea><button class="btn' + (s.done ? ' on' : '') + '" type="button" data-decide="' + d[0] + '">' + (s.done ? 'Decidida' : 'Marcar decidida') + '</button></div></div></div>'; }).join('') + '</div>';
      return;
    }
    const f = F.find(x => x.id === active); if (!f) return;
    const ids = checksOf(f); const dn = doneCount(ids); const st = statusOf(f);
    p.innerHTML = '<div class="ph"><h2>' + f.n + ' · ' + esc(f.title) + '</h2><button class="status ' + st + '" type="button" data-cycle="' + f.id + '" title="Cambiar estado"><span class="dot"></span>' + ST[st] + '</button><p class="lead">' + esc(f.lead) + '</p></div>' +
      (ids.length ? '<div class="progress"><i style="width:' + Math.round(100 * dn / ids.length) + '%"></i></div><div class="pline"><span>' + dn + ' de ' + ids.length + ' tareas</span><span>toca el estado para cambiarlo</span></div>' : '') +
      f.sections.map(sectionHtml).join('');
  }

  // ---------- Events ----------
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]'); if (go) { active = go.getAttribute('data-go'); renderNav(); renderPanel(); $('#panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const cy = e.target.closest('[data-cycle]'); if (cy) { const id = cy.getAttribute('data-cycle'); const f = F.find(x => x.id === id); const cur = statusOf(f); const next = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]; const st = {}; st[id] = next; persist({ status: st }); return; }
    const dc = e.target.closest('[data-decide]'); if (dc) { const id = dc.getAttribute('data-decide'); const cur = state.decisions[id] || {}; const ta = document.querySelector('[data-note="' + id + '"]'); const d = {}; d[id] = { done: !cur.done, note: ta ? ta.value : (cur.note || '') }; persist({ decisions: d }); return; }
  });
  document.addEventListener('change', (e) => {
    const c = e.target.closest('[data-check]'); if (c) { const ch = {}; ch[c.getAttribute('data-check')] = c.checked; persist({ checks: ch }); return; }
    if (e.target.id === 'launch') { persist({ launchDate: e.target.value || '' }); return; }
    const n = e.target.closest('[data-note]'); if (n) { const id = n.getAttribute('data-note'); const cur = state.decisions[id] || {}; if ((cur.note || '') !== n.value) { const d = {}; d[id] = { done: !!cur.done, note: n.value }; persist({ decisions: d }); } }
  });

  // ---------- Boot ----------
  lsLoad();
  renderAll();

  (async () => {
    try {
      const d = await (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
      if (!d) return;
      db = d; docRef = db.doc('plan/state');
      const snap = await docRef.get();
      if (snap.exists) { state = Object.assign({ launchDate: '', checks: {}, decisions: {}, status: {} }, snap.data()); lsSave(); renderAll(); }
      else { await docRef.set(clone(state)); }
      const sy = $('#sync'); sy.className = 'sync ok'; sy.lastElementChild.textContent = 'compartido: lo que cambies lo ven todos';
      docRef.onSnapshot((s) => {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        const inc = s.data(); const cur = JSON.stringify(state); const next = Object.assign({ launchDate: '', checks: {}, decisions: {}, status: {} }, inc);
        if (JSON.stringify(next) !== cur) { if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return; state = next; lsSave(); renderAll(); }
      }, () => {});
    } catch (e) {}
  })();
})();
</script>
