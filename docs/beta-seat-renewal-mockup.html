<title>Beta Seat Renewal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  /* Tokens shared by src/lib/emails/kit.ts (DPE) and apps/mobile/src/theme/tokens.ts:
     navy elevation scale, cyan for links and calm CTAs, gold for the main CTA,
     Nunito on both surfaces. Committed single theme, painted explicitly. */
  :root {
    --bg0: #051834; --bg1: #08264d; --bg2: #0a2b56; --bg3: #13315e; --bg4: #1d437a;
    --line: rgba(125, 211, 252, 0.18); --hair: rgba(255, 255, 255, 0.09);
    --fg: #eef4fc; --fg-soft: #c2d2e8; --muted: #8aa0be; --faint: #54708f;
    --gold: #fcd34d; --gold-ink: #2a1a02; --cyan: #7dd3fc; --cyan-ink: #06213a; --green: #5fd0a3;
    --page: #0b1220; --page-fg: #dbe4f3; --bezel: #15171d;
    --sans: "Nunito", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--page); }
  body {
    margin: 0; color: var(--page-fg); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 28px 56px; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .intro h1 { font-size: 22px; font-weight: 900; margin: 0 0 4px; letter-spacing: -0.01em; }
  .intro p { margin: 0; color: var(--muted); max-width: 62ch; }

  .frames { display: flex; flex-wrap: wrap; gap: 28px 32px; justify-content: center; margin-top: 28px; }
  figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
  figcaption { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); text-align: center; }
  figcaption span { display: block; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 2px; }

  /* Phone frame: laid out at 390 x 812 pt (so the fold is the real one) and
     shown scaled down so both fit side by side without scrolling. */
  :root { --phone-scale: 0.72; }
  .phone-scale { width: calc(390px * var(--phone-scale)); height: calc(812px * var(--phone-scale)); }
  .phone {
    width: 390px; height: 812px; flex: none;
    transform: scale(var(--phone-scale)); transform-origin: top left;
    border-radius: 48px; background: var(--bezel);
    padding: 10px; position: relative;
    box-shadow: 0 40px 70px -30px rgba(0,0,0,.95), inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .screen {
    position: relative; height: 100%; border-radius: 39px; overflow: hidden;
    background: var(--bg0); color: var(--fg); display: flex; flex-direction: column;
  }
  .status {
    flex: none; height: 48px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 30px 6px; font-size: 14px; font-weight: 800;
  }
  .status .ico { display: flex; gap: 6px; align-items: center; }
  .status svg { height: 12px; width: auto; }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 118px; height: 34px; border-radius: 20px; background: #000; z-index: 3; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 132px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.55); z-index: 3; }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* Shared: check icon inside list rows */
  .row-ic { flex: none; width: 15px; height: 15px; margin-top: 3px; }

  /* ---------- Phone 1: Mail app ---------- */
  .mail .screen { background: #000; color: #f2f2f7; }
  .mailbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 8px; font-size: 16px; color: #0a84ff; }
  .mailbar .back { display: flex; align-items: center; gap: 4px; }
  .mailbar svg { width: 11px; height: 18px; }
  .mailhead { padding: 2px 16px 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .from { display: flex; gap: 10px; align-items: center; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg2); font-weight: 900; color: var(--cyan); font-size: 13px; }
  .from b { display: block; font-size: 14px; font-weight: 800; line-height: 1.2; }
  .from span { font-size: 12px; color: #8e8e93; }
  .from .when { margin-left: auto; font-size: 12px; color: #8e8e93; align-self: flex-start; }
  .subject { margin: 8px 0 0; font-size: 15px; font-weight: 700; line-height: 1.3; }

  .email { position: relative; background: var(--bg0); padding: 18px 16px 18px; min-height: 100%; }
  .email::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 220px; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, rgba(252,211,77,.14), transparent 60%);
  }
  .email > * { position: relative; }
  .wordmark { display: flex; align-items: center; gap: 7px; font-weight: 900; font-size: 13px; color: var(--fg-soft); margin-bottom: 14px; letter-spacing: .02em; }
  .wordmark svg { width: 18px; height: 18px; }
  .email h2 { font-size: 23px; font-weight: 900; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.015em; text-wrap: balance; }
  .email h2 em { font-style: normal; color: var(--gold); }
  .email p { margin: 0 0 10px; color: var(--fg-soft); font-size: 13.5px; line-height: 1.45; }

  .ebox { padding: 13px 14px 14px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
  .ebox.gift { border-color: rgba(252,211,77,.45); background: linear-gradient(180deg, rgba(252,211,77,.08), transparent 70%), var(--bg2); margin-top: 12px; }
  .ebox .tag { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 5px; }
  .ebox h3 { margin: 0 0 4px; font-size: 17px; font-weight: 900; line-height: 1.2; }
  .ebox p { margin: 0 0 10px; font-size: 13px; color: var(--fg-soft); }
  .ebtn { display: block; text-align: center; text-decoration: none; padding: 12px 14px; border-radius: 10px; font-weight: 800; font-size: 14px; background: var(--gold); color: var(--gold-ink); }
  .email .fine { margin: 12px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .email .sign { margin: 12px 0 0; color: var(--fg-soft); font-size: 13px; }
  .email .sign b { color: var(--fg); }
  .efoot { padding: 14px 16px 36px; background: #000; font-size: 11px; color: #8e8e93; text-align: center; }
  .efoot a { color: #8e8e93; }

  /* ---------- Phone 2: in-app ---------- */
  .appbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 2px 16px 8px; }
  .appbar .back { width: 34px; height: 34px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; }
  .appbar .back svg { width: 9px; height: 15px; }
  .appbar b { font-size: 16px; font-weight: 900; }
  .body { position: relative; padding: 4px 16px 24px; }
  .body::before {
    content: ""; position: absolute; inset: -60px 0 auto 0; height: 240px; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, rgba(252,211,77,.12), transparent 60%);
  }
  .body > * { position: relative; }
  .overline { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); margin: 0 0 5px; }
  .body h2 { font-size: 24px; font-weight: 900; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.015em; text-wrap: balance; }
  .body h2 em { font-style: normal; color: var(--gold); }
  .body > p { margin: 0 0 14px; color: var(--fg-soft); font-size: 13.5px; line-height: 1.45; }

  .opt { position: relative; display: block; padding: 14px 14px 14px; border-radius: 16px; background: var(--bg2); border: 1.5px solid var(--line); }
  .opt.stay { border-color: rgba(252,211,77,.55); box-shadow: 0 16px 34px -20px rgba(252,211,77,.45); background: linear-gradient(180deg, rgba(252,211,77,.08), transparent 70%), var(--bg2); }
  .opt .tag { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 3px; }
  .opt h3 { margin: 2px 0 0; font-size: 18px; font-weight: 900; line-height: 1.2; }
  .opt .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .opt ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 5px; }
  .opt li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: var(--fg-soft); }
  .opt li b { color: var(--fg); font-weight: 800; }

  .cta { margin-top: 12px; }
  .note { margin-top: 14px; padding: 0 2px; }
  .note h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 800; color: var(--fg); }
  .note p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  .note a { color: var(--cyan); font-weight: 700; text-decoration: none; }
  .email .note { margin-top: 14px; }
  .email .note p { margin: 0; }
  .btn { width: 100%; appearance: none; border: 0; cursor: pointer; font: 800 15px/1 var(--sans); padding: 15px; border-radius: 12px; background: var(--gold); color: var(--gold-ink); transition: opacity .15s, background .15s; }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .done { padding: 28px 16px 40px; display: grid; gap: 10px; }
  .done .mark { width: 64px; height: 64px; border-radius: 50%; background: rgba(95,208,163,.16); display: grid; place-items: center; margin-bottom: 6px; }
  .done .mark svg { width: 30px; height: 30px; }
  .done h2 { font-size: 26px; font-weight: 900; margin: 0; line-height: 1.15; }
  .done p { margin: 0; color: var(--fg-soft); font-size: 14px; }
  .done .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
  .done .row span:last-child { font-weight: 800; text-align: right; }
  .done .rows { margin-top: 8px; }
  .done a { color: var(--cyan); font-weight: 800; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { .opt, .btn { transition: none; } }
</style>

<div class="wrap">
  <div class="intro">
    <h1>Beta Seat Renewal</h1>
    <p>Two surfaces for one offer: the email that opens the door, and the screen in the app where the tester keeps their seat. Stepping out needs no action, so it is a note, not a button. Dates are placeholders.</p>
  </div>

  <div class="frames">

    <!-- ============ PHONE 1: the email ============ -->
    <figure>
      <figcaption>1 · Email<span>Mail app, iPhone</span></figcaption>
      <div class="phone-scale"><div class="phone mail">
        <div class="screen">
          <div class="island"></div>
          <div class="status"><span>9:41</span><span class="ico">
            <svg viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx=".6"/><rect x="5" y="5.5" width="3" height="6.5" rx=".6"/><rect x="10" y="3" width="3" height="9" rx=".6"/><rect x="15" y="0" width="3" height="12" rx=".6"/></svg>
            <svg viewBox="0 0 27 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="1.8" fill="#fff"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg>
          </span></div>
          <div class="mailbar">
            <span class="back"><svg viewBox="0 0 12 20" fill="none"><path d="M10 2 2 10l8 8" stroke="#0a84ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Inbox</span>
          </div>
          <div class="scroll">
            <div class="mailhead">
              <div class="from">
                <div class="avatar">DP</div>
                <div><b>Digital Polyglot</b><span>To: you</span></div>
                <span class="when">Today, 10:12</span>
              </div>
              <p class="subject">Thank you, Marta. Six more months, on us?</p>
            </div>
            <div class="email">
              <div class="wordmark">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z" fill="#7dd3fc"/><path d="M13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13V4Z" fill="#fcd34d"/></svg>
                Digital Polyglot
              </div>
              <h2>Thank you, Marta. <em>Six more months, on us?</em></h2>
              <p>Every bug you reported and every story you finished shaped what Digital Polyglot is today. We launch officially on 5 October, and we would like to say thank you the only way that feels right: by keeping your seat.</p>

              <div class="ebox gift">
                <span class="tag">Our thank-you</span>
                <h3>Stay six more months</h3>
                <p>Every premium feature, free until 5 April 2027: all journeys and levels, practice, offline reading and the books. New features reach you weeks before anyone else. All we ask: keep telling us what breaks.</p>
                <a class="ebtn" href="#app">Keep my seat</a>
              </div>

              <div class="note">
                <h4>Prefer to step out?</h4>
                <p>Nothing to do. When the app is published on 5 October your account moves to the free basic plan, with your progress and saved stories intact, and the test emails stop. Whenever you feel like testing again, apply at <a href="#">digitalpolyglot.com/beta</a>.</p>
              </div>

              <p class="sign">With our thanks,<br><b>Alejandro</b></p>
            </div>
            <div class="efoot">Digital Polyglot · <a href="#">Unsubscribe</a></div>
          </div>
          <div class="home"></div>
        </div>
      </div></div>
    </figure>

    <!-- ============ PHONE 2: in-app ============ -->
    <figure id="app">
      <figcaption>2 · In the app<span>Opens from the button in the email</span></figcaption>
      <div class="phone-scale"><div class="phone">
        <div class="screen">
          <div class="island"></div>
          <div class="status"><span>9:41</span><span class="ico">
            <svg viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx=".6"/><rect x="5" y="5.5" width="3" height="6.5" rx=".6"/><rect x="10" y="3" width="3" height="9" rx=".6"/><rect x="15" y="0" width="3" height="12" rx=".6"/></svg>
            <svg viewBox="0 0 27 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="1.8" fill="#fff"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg>
          </span></div>
          <div class="appbar">
            <span class="back"><svg viewBox="0 0 10 16" fill="none"><path d="M8 2 2 8l6 6" stroke="#eef4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <b>Your seat</b>
          </div>
          <div class="scroll">
            <form class="body" id="choice" novalidate>
              <p class="overline">Launch on 5 October</p>
              <h2>Thank you, Marta. <em>Six more months, on us?</em></h2>
              <p>Your reports shaped this product. As a thank-you, your seat can stay open after the official launch. Either way, your progress and saved stories stay.</p>

              <div class="opt stay">
                <span class="tag">Our thank-you</span>
                <h3>Stay six more months</h3>
                <p class="sub">Premium free until 5 April 2027</p>
                <ul>
                  <li><svg class="row-ic" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#fcd34d" stroke-width="1.4"/><path d="M5 8.2l2 2 4-4.2" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>Every premium feature:</b> all journeys, practice, offline, books.</span></li>
                  <li><svg class="row-ic" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#fcd34d" stroke-width="1.4"/><path d="M5 8.2l2 2 4-4.2" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>New features first</b>, weeks before the store.</span></li>
                  <li><svg class="row-ic" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#fcd34d" stroke-width="1.4"/><path d="M5 8.2l2 2 4-4.2" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>All we ask:</b> keep telling us what breaks.</span></li>
                </ul>
                <div class="cta">
                  <button class="btn" id="confirm" type="button">Keep my seat</button>
                </div>
              </div>

              <div class="note">
                <h4>Prefer to step out?</h4>
                <p>Nothing to do. On 5 October your account moves to the free basic plan, with your progress and saved stories intact, and the test emails stop. Whenever you feel like testing again, apply at <a href="#">digitalpolyglot.com/beta</a>.</p>
              </div>
            </form>

            <div class="done" id="done" hidden>
              <div class="mark"><svg viewBox="0 0 30 30" fill="none"><path d="M7 15.5l5.5 5.5L23 10" stroke="#5fd0a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <h2 id="done-title"></h2>
              <p id="done-body"></p>
              <div class="rows" id="done-rows"></div>
              <p><a href="#" id="undo">Undo</a></p>
            </div>
          </div>
          <div class="home"></div>
        </div>
      </div></div>
    </figure>

  </div>
</div>

<script>
  (function () {
    var form = document.getElementById('choice');
    var confirm = document.getElementById('confirm');
    var done = document.getElementById('done');
    var doneTitle = document.getElementById('done-title');
    var doneBody = document.getElementById('done-body');
    var doneRows = document.getElementById('done-rows');
    var undo = document.getElementById('undo');

    confirm.addEventListener('click', function () {
      doneTitle.textContent = 'Your seat is kept. Thank you.';
      doneBody.textContent = 'Every premium feature stays open until 5 April 2027. We will write once when the next build is ready.';
      doneRows.innerHTML = [['Plan', 'Premium, every feature'], ['Until', '5 April 2027'], ['Cost', 'Nothing']].map(function (r) {
        return '<div class="row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
      }).join('');
      form.hidden = true;
      done.hidden = false;
      form.parentNode.scrollTop = 0;
    });

    undo.addEventListener('click', function (e) {
      e.preventDefault();
      done.hidden = true;
      form.hidden = false;
      form.parentNode.scrollTop = 0;
    });
  })();
</script>
